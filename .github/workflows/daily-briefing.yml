name: Daily Card & Finance Kakao Briefing

on:
  # GitHub Actions의 자체 schedule 트리거는 이 저장소에서 신뢰할 수 없었다 —
  # 처음엔 며칠간 아예 실행되지 않았고, 이후엔 실행되긴 했지만 매번 다른
  # (그리고 설정한 cron과 무관한, 아침이 아닌) 시각에 실행되어 외부 백업
  # 트리거(매일 08:07 KST에 GitHub API로 workflow_dispatch 호출)와 겹쳐
  # 하루에 두 번 발송되는 문제가 있었다. 그래서 schedule은 빼고
  # workflow_dispatch(수동/외부 트리거)만 남긴다 — 실제 매일 발송은 외부
  # 트리거가 담당한다.
  workflow_dispatch: {}

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Kakao briefing
        working-directory: scripts
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python send_daily_briefing.py
